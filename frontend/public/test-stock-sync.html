<!DOCTYPE html>
<html>
<head>
    <title>Stock Sync Test - Aloweda</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #2d5f3f; }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .product {
            padding: 10px;
            margin: 5px 0;
            background: #f5f5f5;
            border-left: 4px solid #2d5f3f;
        }
        .out-of-stock {
            border-left-color: #dc2626;
            background: #fee2e2;
        }
        button {
            padding: 10px 20px;
            background: #2d5f3f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #1f4430;
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 Stock Sync Test Tool</h1>
    
    <div class="section">
        <h2>Step 1: Fetch Database Products</h2>
        <button onclick="fetchDatabaseProducts()">Fetch from API</button>
        <div id="dbProducts"></div>
    </div>

    <div class="section">
        <h2>Step 2: Test Name Matching</h2>
        <p>Enter product name from website:</p>
        <input type="text" id="testName" style="width: 100%; padding: 8px;" 
               placeholder="Anti Acne Face wash: 100 ml, Salicylic Acid 2% for Oily & Acne Prone Skin">
        <button onclick="testMatching()" style="margin-top: 10px;">Test Match</button>
        <div id="matchResult"></div>
    </div>

    <div class="section">
        <h2>Console Log</h2>
        <div id="log" class="log"></div>
    </div>

    <script>
        const API_URL = 'https://aloweda-backend.vercel.app'; // Replace with your backend URL
        let dbProducts = [];

        function log(message, color = '#0f0') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div style="color: ${color}">[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        async function fetchDatabaseProducts() {
            log('📡 Fetching products from API...');
            
            try {
                const response = await fetch(`${API_URL}/api/admin/products/public`);
                const data = await response.json();
                
                if (data.success && data.products) {
                    dbProducts = data.products;
                    log(`✅ Fetched ${data.products.length} products`, '#0f0');
                    
                    const container = document.getElementById('dbProducts');
                    container.innerHTML = '<h3>Database Products:</h3>';
                    
                    data.products.forEach((product, index) => {
                        const stockStatus = product.stock === 0 ? 'OUT OF STOCK' : `IN STOCK (${product.stock})`;
                        const className = product.stock === 0 ? 'product out-of-stock' : 'product';
                        
                        container.innerHTML += `
                            <div class="${className}">
                                <strong>${index + 1}. ${product.name}</strong><br>
                                Stock: ${stockStatus} | Price: ₹${product.price}
                            </div>
                        `;
                        
                        log(`${product.stock === 0 ? '🔴' : '🟢'} ${product.name} → stock: ${product.stock}`);
                    });
                } else {
                    log('❌ Failed to fetch products', '#f00');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, '#f00');
            }
        }

        function normalizeProductName(name) {
            return name.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
        }

        function testMatching() {
            const testName = document.getElementById('testName').value;
            if (!testName) {
                alert('Please enter a product name');
                return;
            }
            
            if (dbProducts.length === 0) {
                alert('Please fetch database products first (Step 1)');
                return;
            }

            log(`\n🧪 Testing match for: "${testName}"`, '#ff0');
            
            const normalized = normalizeProductName(testName);
            log(`Normalized frontend: "${normalized.substring(0, 50)}..."`);
            
            // Create map like in App.jsx
            const dbProductMap = new Map();
            dbProducts.forEach(dbProduct => {
                const normalizedDbName = normalizeProductName(dbProduct.name);
                dbProductMap.set(normalizedDbName, dbProduct);
                log(`DB Normalized: "${normalizedDbName.substring(0, 50)}..."`);
            });
            
            // Try exact match
            let dbProduct = dbProductMap.get(normalized);
            
            if (dbProduct) {
                log(`✅ EXACT MATCH FOUND!`, '#0f0');
                showMatchResult(dbProduct, 'exact');
                return;
            }
            
            // Try partial matching
            for (const [dbName, dbProd] of dbProductMap.entries()) {
                if (normalized.length >= 15 && dbName.length >= 15) {
                    if (normalized.includes(dbName) || dbName.includes(normalized)) {
                        log(`✅ PARTIAL MATCH FOUND!`, '#0f0');
                        showMatchResult(dbProd, 'partial');
                        return;
                    }
                }
                
                // Try prefix match
                const prodStart = normalized.substring(0, 20);
                const dbStart = dbName.substring(0, 20);
                if (prodStart === dbStart && prodStart.length >= 15) {
                    log(`✅ PREFIX MATCH FOUND!`, '#0f0');
                    showMatchResult(dbProd, 'prefix');
                    return;
                }
            }
            
            log(`❌ NO MATCH FOUND!`, '#f00');
            document.getElementById('matchResult').innerHTML = `
                <div style="color: red; padding: 15px; margin-top: 10px; background: #fee;">
                    <strong>❌ No matching product found in database!</strong><br>
                    This product will default to IN STOCK (stock: 100)
                </div>
            `;
        }

        function showMatchResult(product, matchType) {
            const stockStatus = product.stock === 0 ? 'OUT OF STOCK' : `IN STOCK (${product.stock})`;
            const color = product.stock === 0 ? '#dc2626' : '#10b981';
            
            log(`Match Type: ${matchType}`, '#ff0');
            log(`Product Name: ${product.name}`);
            log(`Stock: ${product.stock}`);
            log(`Status: ${stockStatus}`);
            
            document.getElementById('matchResult').innerHTML = `
                <div style="padding: 15px; margin-top: 10px; border: 2px solid ${color}; background: ${color}11;">
                    <h3 style="color: ${color}">✅ Match Found (${matchType})</h3>
                    <p><strong>Database Product:</strong> ${product.name}</p>
                    <p><strong>Stock:</strong> ${product.stock}</p>
                    <p><strong>Status:</strong> <span style="color: ${color}; font-weight: bold;">${stockStatus}</span></p>
                    <p><strong>Price:</strong> ₹${product.price}</p>
                </div>
            `;
        }

        // Auto-fetch on page load
        window.onload = () => {
            log('🚀 Stock Sync Test Tool Ready');
            log('Click "Fetch from API" to start');
        };
    </script>
</body>
</html>
